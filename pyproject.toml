[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typepro-workflows"
version = "0.1.0"
description = "TypePro data, finetuning and inference workflows"
requires-python = ">=3.10"

[project.scripts]
typepro = "typepro.__main__:main"

[tool.setuptools.packages.find]
include = ["typepro*", "codet5p_type_retrieval*"]
exclude = ["*tests*"]
